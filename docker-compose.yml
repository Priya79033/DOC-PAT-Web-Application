services:
  mongo:
    image: mongo:7
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/doc-pat
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo:
  uploads:
